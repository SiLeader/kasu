name: Release
# Creates the GitHub release v<version>: CLI archives for Linux and macOS as
# assets, plus the server and web container images (see container.yml).
# Run it from the default branch with the version in Cargo.toml, e.g. 0.1.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without a leading v (must match Cargo.toml and Cargo.lock)
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::releases must be run from $DEFAULT_BRANCH, not $REF_NAME"
            exit 1
          fi
          python3 tools/release/check_version.py "$VERSION"
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$tag"
            # A version with a suffix (0.2.0-rc.1) is a pre-release and never becomes latest.
            if [[ $VERSION == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"

  cli:
    name: cli (${{ matrix.label }})
    needs: verify
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: ""
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, label: linux-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, label: macos-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --locked -p kasu-cli --target ${{ matrix.target }}
      - name: Package
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
        run: |
          name="kasu-$TAG-$LABEL"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/kasu" LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  containers:
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      latest: ${{ needs.verify.outputs.prerelease != 'true' }}

  release:
    needs: [verify, cli, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          notes="Container images: \`ghcr.io/sileader/kasu/server:$VERSION\`, \`ghcr.io/sileader/kasu/web:$VERSION\`"
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "kasu $TAG" \
            --notes "$notes" \
            --generate-notes \
            "${flags[@]}"
