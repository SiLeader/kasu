[package]
name = "kasu-server"
default-run = "kasu-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
production = ["kasu-store/production"]

[dependencies]
kasu-telemetry.workspace = true
kasu-core.workspace = true
kasu-store.workspace = true
kasu-derived.workspace = true
kasu-ops.workspace = true
kasu-git.workspace = true
kasu-ingest.workspace = true
kasu-proto.workspace = true
kasu-object.workspace = true
prost.workspace = true
tonic.workspace = true
tokio.workspace = true
axum.workspace = true
tokio-stream.workspace = true
serde.workspace = true
serde_json = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
hmac = "0.12.1"
sha2 = "0.10.9"
jiff = "0.2"
hex.workspace = true
tracing.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body = "1"

[dev-dependencies]
tempfile.workspace = true
http-body-util = "0.1"

[dependencies.base64]
workspace = true
[dependencies.flate2]
workspace = true

[[bin]]
name = "kasu-server"
path = "src/main.rs"

[[bin]]
name = "kasu-git-ssh"
path = "src/ssh_main.rs"
