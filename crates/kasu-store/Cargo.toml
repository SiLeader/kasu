[package]
name = "kasu-store"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
postgres = ["dep:postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:webpki-roots", "dep:tokio"]
s3 = ["dep:object_store", "dep:tokio", "dep:futures-util", "dep:reqwest", "dep:rustls"]
production = ["postgres", "s3"]

[dependencies]
kasu-core.workspace = true
rusqlite.workspace = true
zstd.workspace = true
tempfile.workspace = true
tracing.workspace = true
postgres = { version = "=0.19.14", optional = true }
tokio-postgres-rustls = { version = "=0.14.0", optional = true, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
tokio = { workspace = true, optional = true }
object_store = { version = "=0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"], optional = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"], optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
proptest.workspace = true
