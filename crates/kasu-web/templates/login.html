{% extends "layout.html" %}
{% block content %}
<h1>{{ page.t.s("Log in with a personal access token") }}</h1>
{% if let Some(error) = error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/-/login" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>{{ page.t.s("Personal access token") }}<input type="password" name="token" autocomplete="off" required autofocus></label>
  <div><button type="submit" class="primary">{{ page.t.s("Log in") }}</button></div>
</form>
{% endblock %}
