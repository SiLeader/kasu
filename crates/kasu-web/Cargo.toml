[package]
name = "kasu-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
kasu-core.workspace = true
kasu-proto.workspace = true
kasu-telemetry.workspace = true
tonic = { workspace = true, features = ["tls-ring", "tls-webpki-roots"] }
tokio.workspace = true
tokio-stream.workspace = true
axum = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
hex.workspace = true
blake3.workspace = true
base64.workspace = true
getrandom.workspace = true
hmac = "0.12.1"
sha2 = "0.10.9"
jiff = "0.2"
askama = "0.16"
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "html", "regex-fancy"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4.2"
percent-encoding = "2.3"
form_urlencoded = "1.2"
prost.workspace = true
sha1.workspace = true

[dev-dependencies]
kasu-server.workspace = true
kasu-store.workspace = true
tempfile.workspace = true
flate2.workspace = true
proptest.workspace = true
tower = { version = "0.5", features = ["util"] }
